<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destiny Raid Clinic</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600&display=swap">
<style>
  :root{color-scheme:dark;--bg:#0a0d11;--fg:#eef1f4;--muted:#93a0ad;--line:rgba(220,230,240,.14);--accent:#e9b949}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 'Hanken Grotesk','Helvetica Neue',Arial,sans-serif}
  main{max-width:760px;margin:0 auto;padding:64px max(16px,env(safe-area-inset-left,0px)) 64px max(16px,env(safe-area-inset-right,0px))}
  .k{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  h1{font-weight:300;font-size:clamp(30px,5vw,46px);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 12px}
  p{color:var(--muted);margin:0 0 32px}
  ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  li a{display:flex;justify-content:space-between;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
  li a:hover,li a:focus-visible{color:var(--accent);outline:none}
  li span{color:var(--muted);font-size:14px}
  footer{margin-top:40px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="k">Raid trainers</div>
  <h1>Destiny Raid Clinic</h1>
  <p>Pick a seat in the fireteam and play the encounter. Bots run the other five jobs, and every wipe explains what went wrong.</p>
  <ul>
    <li><a href="vault-of-glass/atheon/"><b>Atheon, Time’s Conflux</b><span>Vault of Glass</span></a></li>
  </ul>
</main>
</body>
</html>
