name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests, content)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Content matches the templates
        run: cargo run --quiet --package raidlint -- check

  web:
    name: JS/JSON (Biome, prototype tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: node scripts/lint-styles.mjs
      - run: pnpm run test:scripts
      - run: pnpm --filter @raid-clinic/ui exec tsc -p . --noEmit
      - run: pnpm --filter site check
      - run: pnpm --filter @raid-clinic/ui test
      - run: pnpm --filter site test
      - run: pnpm --filter site build
      # Browsers come from Playwright's CDN and system libraries from apt; either can stall, so
      # cache the browser, time-box each attempt and retry instead of hanging the job.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            cmd="install-deps chromium"
          else
            cmd="install --with-deps chromium"
          fi
          for attempt in 1 2 3; do
            timeout 150 pnpm --filter site exec playwright $cmd && exit 0
            echo "playwright $cmd attempt $attempt failed or stalled; retrying"
          done
          exit 1
      - name: Browser tests
        timeout-minutes: 15
        run: pnpm --filter site exec playwright test
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/site/test-results/
          retention-days: 7
      - run: pnpm run test:prototype
